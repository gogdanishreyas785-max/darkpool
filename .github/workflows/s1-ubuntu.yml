name: S1 Ubuntu build and tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - perf/64-player-load-test
      - 'perf/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure Release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDARKPOOL_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run malformed TCP integration test
        run: ctest --test-dir build --output-on-failure -R '^darkpool_malformed_tcp_tests$'
      - name: Run full test suite
        run: ctest --test-dir build --output-on-failure
      - name: Validate L6 sustained evidence and run validator regression tests
        run: |
          python3 tools/validate_l6_sustained_evidence.py
          python3 tests/test_validate_l6_sustained_evidence.py
      - name: Validate L8 flood evidence and run validator regression tests
        run: |
          python3 tools/validate_l8_evidence.py
          python3 tests/test_validate_l8_evidence.py

name: Gemini AI Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  gemini-chat:
    # Triggers whenever someone types @gemini-cli in an issue or PR comment
    if: contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_KEY }}
          gemini_model: 'gemini-2.5-pro'
          prompt: |
            A user left the following comment on GitHub:
            "${{ github.event.comment.body }}"
            
            Analyze the repository context and respond helpfully to their request.
